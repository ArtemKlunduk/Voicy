<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — display & headings</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 56px 1fr 64px; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .specimen { color: var(--ink); }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); text-align: right; }
</style></head><body>
<div class="row"><div class="tag">display</div><div class="specimen" style="font-size:40px;line-height:44px;font-weight:600;letter-spacing:-0.02em;">Тише, чем кажется.</div><div class="spec">40/44 · 600</div></div>
<div class="row"><div class="tag">h1</div><div class="specimen" style="font-size:28px;line-height:32px;font-weight:600;letter-spacing:-0.015em;">Голос — в Telegram</div><div class="spec">28/32 · 600</div></div>
<div class="row"><div class="tag">h2</div><div class="specimen" style="font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.01em;">Кому отправить</div><div class="spec">20/26 · 600</div></div>
<div class="row"><div class="tag">h3</div><div class="specimen" style="font-size:16px;line-height:22px;font-weight:600;">Настройки распознавания</div><div class="spec">16/22 · 600</div></div>
</body></html>

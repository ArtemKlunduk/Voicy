<!doctype html>
<html lang="ru" data-screen-label="Voicy desktop kit">
<head>
<meta charset="utf-8">
<title>Voicy — desktop UI kit</title>
<link rel="icon" href="../../assets/voicy-logo.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body {
    background: linear-gradient(180deg, #F2F4EE 0%, #E4E9DA 100%);
    min-height: 100%;
    margin: 0;
    overflow-x: hidden;
  }
  body {
    display: grid; place-items: center;
    padding: 32px 24px;
    font-family: var(--font-sans);
  }
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .caption {
    font-size: 12px; color: var(--ink-3);
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }

  /* Keyframes shared by the components */
  @keyframes vy-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes vy-wave  { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
  @keyframes vy-halo  { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.08); opacity: 0.7; } }
  @keyframes vy-spin  { to { transform: rotate(360deg); } }
  @keyframes vy-rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes vy-toast { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Drop the bottom border from the last row in each Section card */
  .vy-row:last-child { border-bottom: 0 !important; }

  .demo-nav {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-3);
    font-family: var(--font-mono);
  }
  .demo-nav a {
    text-decoration: none; color: var(--ink-2);
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.6);
    transition: background 120ms, color 120ms;
  }
  .demo-nav a:hover { background: var(--paper); color: var(--ink); }
  .demo-nav .sep { color: var(--ink-3); }
</style>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
    <div class="demo-nav">
      <a href="?screen=main"><span>Main</span></a>
      <a href="?screen=connect"><span>Connect</span></a>
      <a href="?screen=settings"><span>Settings</span></a>
      <span class="sep">·</span>
      <a href="#" id="trigger-rec"><span>Trigger recording</span></a>
    </div>
    <div class="caption">UI kit · try Alt + X</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Window.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="ContactList.jsx"></script>
  <script type="text/babel" src="RecordPanel.jsx"></script>
  <script type="text/babel" src="HotkeyHint.jsx"></script>
  <script type="text/babel" src="ConnectScreen.jsx"></script>
  <script type="text/babel" src="SettingsScreen.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.VoicyApp />);
    document.getElementById('trigger-rec').addEventListener('click', (e) => {
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', code: 'KeyX', altKey: true }));
    });
  </script>
</body>
</html>

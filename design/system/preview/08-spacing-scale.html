<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 16px; }
  .scale { display: flex; align-items: flex-end; gap: 12px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--sage-soft); border-radius: 4px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .num { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-weight: 500; }
</style></head><body>
<h2>Spacing — 8-pt scale</h2>
<div class="scale">
  <div class="step"><div class="bar" style="width:4px;height:80px;"></div><div class="num">4</div><div class="label">--s-1</div></div>
  <div class="step"><div class="bar" style="width:8px;height:80px;"></div><div class="num">8</div><div class="label">--s-2</div></div>
  <div class="step"><div class="bar" style="width:12px;height:80px;"></div><div class="num">12</div><div class="label">--s-3</div></div>
  <div class="step"><div class="bar" style="width:16px;height:80px;"></div><div class="num">16</div><div class="label">--s-4</div></div>
  <div class="step"><div class="bar" style="width:24px;height:80px;"></div><div class="num">24</div><div class="label">--s-5</div></div>
  <div class="step"><div class="bar" style="width:32px;height:80px;"></div><div class="num">32</div><div class="label">--s-6</div></div>
  <div class="step"><div class="bar" style="width:48px;height:80px;"></div><div class="num">48</div><div class="label">--s-7</div></div>
  <div class="step"><div class="bar" style="width:64px;height:80px;"></div><div class="num">64</div><div class="label">--s-8</div></div>
</div>
</body></html>

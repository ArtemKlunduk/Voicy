<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — brand mark</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; height: 240px; display: grid; grid-template-columns: 240px 1fr; }
  .left {
    background: var(--ink);
    display: grid; place-items: center;
  }
  .right {
    padding: 28px 32px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .name {
    font-size: 36px; font-weight: 600; letter-spacing: -0.025em; margin: 0;
  }
  .tag {
    color: var(--ink-2); font-size: 14px; line-height: 20px; max-width: 360px;
  }
  .meta {
    display: flex; gap: 14px; font-size: 12px; color: var(--ink-3);
  }
  .meta b { color: var(--ink-2); font-weight: 500; }
</style>
</head><body>
  <div class="left">
    <img src="../assets/logo-mark.svg" width="148" height="148" alt="Voicy mark">
  </div>
  <div class="right">
    <h1 class="name">Voicy</h1>
    <div class="tag">Маленький голосовой помощник. Жми Alt + X, говори — Telegram отправит.</div>
    <div class="meta">
      <div><b>open source</b></div>
      <div>·</div>
      <div><b>free, forever</b></div>
      <div>·</div>
      <div><b>RU / EN</b></div>
    </div>
  </div>
</body></html>

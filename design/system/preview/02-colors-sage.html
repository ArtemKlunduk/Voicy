<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — sage palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 24px; }
  h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .chip {
    border: 1px solid var(--line);
    border-radius: var(--r-2);
    overflow: hidden;
    background: var(--paper);
  }
  .swatch { height: 84px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; letter-spacing: -0.01em; }
</style></head><body>
<h2>Sage — the brand color</h2>
<div class="grid">
  <div class="chip"><div class="swatch" style="background:#D6E6CF"></div><div class="meta"><div class="name">Sage soft</div><div class="hex">#D6E6CF · --sage-soft</div></div></div>
  <div class="chip"><div class="swatch" style="background:#A8C8A0"></div><div class="meta"><div class="name">Sage</div><div class="hex">#A8C8A0 · --sage</div></div></div>
  <div class="chip"><div class="swatch" style="background:#5E8B62"></div><div class="meta"><div class="name" style="color:#fff;background:#5E8B62;padding:0;">Sage deep</div><div class="hex">#5E8B62 · --sage-deep</div></div></div>
  <div class="chip"><div class="swatch" style="background:#2F4A35"></div><div class="meta"><div class="name">Moss</div><div class="hex">#2F4A35 · --moss</div></div></div>
</div>
</body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — inputs & search</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; display: grid; gap: 16px; }
  .field {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: var(--r-2);
    background: var(--paper); padding: 10px 14px;
    font-size: 14px; color: var(--ink);
  }
  .field.focus { border-color: var(--sage-deep); box-shadow: 0 0 0 3px color-mix(in oklab, var(--sage-deep) 18%, transparent); }
  .field svg { width: 16px; height: 16px; stroke: var(--ink-3); }
  .field input { all: unset; flex: 1; }
  .field input::placeholder { color: var(--ink-3); }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink);
  }
  .switch {
    width: 32px; height: 18px; border-radius: 999px; background: var(--line);
    position: relative; transition: background var(--t-fast) var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 999px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: transform var(--t-fast) var(--ease);
  }
  .switch.on { background: var(--sage-deep); }
  .switch.on::after { transform: translateX(14px); }
  .row { display: flex; align-items: center; gap: 20px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); width: 72px; }
</style></head><body>
<div class="row"><div class="lbl">field</div>
  <div class="field" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input placeholder="Найти контакт…">
  </div>
</div>
<div class="row"><div class="lbl">focus</div>
  <div class="field focus" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input value="мама" autofocus>
  </div>
</div>
<div class="row"><div class="lbl">toggle</div>
  <div class="toggle"><span class="switch on"></span>Запуск с системой</div>
  <div class="toggle" style="color:var(--ink-2);"><span class="switch"></span>Звук подтверждения</div>
</div>
</body></html>

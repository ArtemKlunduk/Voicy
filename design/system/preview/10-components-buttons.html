<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 14px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .lbl { width: 72px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }

  .btn { all: unset; cursor: pointer; box-sizing: border-box;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    padding: 9px 14px; border-radius: var(--r-2);
    display: inline-flex; align-items: center; gap: 8px;
    transition: all var(--t-fast) var(--ease);
  }
  .btn-primary { background: var(--sage-deep); color: #fff; }
  .btn-primary.hover { background: var(--moss); box-shadow: var(--shadow-1); }
  .btn-primary.press { background: var(--moss); transform: translateY(1px); }
  .btn-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .btn-secondary.hover { background: var(--paper-2); border-color: var(--line-strong); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost.hover { background: var(--paper-2); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger) 30%, var(--line)); }
  .btn-disabled { background: var(--paper-2); color: var(--ink-3); cursor: not-allowed; }
  svg { width: 16px; height: 16px; }
</style></head><body>
<div class="row"><div class="lbl">primary</div>
  <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>Отправить</button>
  <button class="btn btn-primary hover">hover</button>
  <button class="btn btn-primary press">pressed</button>
</div>
<div class="row"><div class="lbl">secondary</div>
  <button class="btn btn-secondary">Отмена</button>
  <button class="btn btn-secondary hover">hover</button>
</div>
<div class="row"><div class="lbl">ghost</div>
  <button class="btn btn-ghost">Настройки</button>
  <button class="btn btn-ghost hover">hover</button>
</div>
<div class="row"><div class="lbl">disabled</div>
  <button class="btn btn-disabled">Отправить</button>
  <div class="lbl" style="width:auto;margin-left:8px;">danger</div>
  <button class="btn btn-danger">Удалить контакт</button>
</div>
</body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — motion</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  h3 { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0; }

  /* Halo rings around the mic orb */
  .halo-stage {
    width: 100%; height: 120px;
    border-radius: 14px; background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .halo-stage .orb {
    width: 56px; height: 56px; border-radius: 999px;
    background: var(--sage-soft); color: var(--moss);
    display: grid; place-items: center;
    position: relative; z-index: 2;
  }
  .halo-stage .orb svg { width: 22px; height: 22px; }
  .halo-stage .ring {
    position: absolute; width: 56px; height: 56px;
    border-radius: 999px; border: 1.5px solid var(--sage);
    opacity: 0;
    animation: vy-ring 2.2s cubic-bezier(.2,.6,.2,1) infinite;
  }
  .halo-stage .ring:nth-child(2) { animation-delay: 0.7s; }
  .halo-stage .ring:nth-child(3) { animation-delay: 1.4s; }
  @keyframes vy-ring {
    0%   { transform: scale(0.55); opacity: 0; }
    20%  { opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; line-height: 22px; }
  li b { color: var(--ink); font-weight: 600; }
</style></head><body>
<div class="panel">
  <h3>Recording · halo rings · 2.2s loop</h3>
  <div class="halo-stage">
    <div class="orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <path d="M12 18v3"/>
      </svg>
    </div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
</div>
<div class="panel">
  <h3>Easing & durations</h3>
  <ul>
    <li><b>cubic-bezier(.2,.6,.2,1)</b> — everything UI</li>
    <li><b>120ms</b> · hover, press</li>
    <li><b>240ms</b> · panels, sheets</li>
    <li><b>2.2s</b> · halo rings (3 rings, 0.7s offset)</li>
    <li>No spring. No bounce. No overshoot.</li>
  </ul>
</div>
</body></html>

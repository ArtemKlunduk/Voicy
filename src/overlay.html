<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
:root {
  --paper:       #F7F8F3;
  --sage:        #A8C8A0;
  --sage-soft:   #D6E6CF;
  --sage-deep:   #5E8B62;
  --moss:        #2F4A35;
  --danger:      #B6604D;
  --danger-soft: #F0D7CF;
  --line:        #DDE3D6;
  --ease:        cubic-bezier(0.2, 0.6, 0.2, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background: var(--paper);
  overflow:hidden; user-select:none;
}
html { color-scheme: light; }

.stage {
  width:100%; height:100%;
  display:grid; place-items:center;
  opacity:0; transition:opacity 240ms var(--ease);
}
.stage.on { opacity:1; }

/* Orb — постоянный круг по центру */
.orb {
  width:84px; height:84px; border-radius:999px;
  display:grid; place-items:center;
  position:relative; z-index:2;
  background: var(--sage-soft); color: var(--moss);
  transition: background 240ms var(--ease), color 240ms var(--ease);
}
.orb.success { background: var(--sage-deep); color:#fff; }
.orb.error   { background: var(--danger);    color:#fff; }
.orb svg { width:32px; height:32px; }

/* Halo-кольца — только во время записи */
.ring {
  position: absolute;
  width: 84px; height: 84px;
  border-radius: 999px;
  border: 1.5px solid var(--sage);
  opacity: 0;
  animation: vy-ring 2.2s var(--ease) infinite;
  z-index: 1;
}
.ring:nth-of-type(2) { animation-delay: 0.7s; }
.ring:nth-of-type(3) { animation-delay: 1.4s; }
@keyframes vy-ring {
  0%   { transform: scale(0.55); opacity: 0;   }
  20%  { opacity: 0.7; }
  100% { transform: scale(1.9);  opacity: 0;   }
}
.ring.hidden, .icon.hidden { display: none; }

.icon { display: contents; }
</style>
</head>
<body>
<div id="stage" class="stage">
  <!-- 3 кольца расходятся (только в режиме recording) -->
  <div class="ring" id="r1"></div>
  <div class="ring" id="r2"></div>
  <div class="ring" id="r3"></div>

  <!-- Orb с иконкой -->
  <div id="orb" class="orb">
    <!-- recording: микрофон -->
    <svg id="ic-rec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
      <path d="M12 18v3"/>
    </svg>
    <!-- success: галочка -->
    <svg id="ic-ok" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <!-- error: крест -->
    <svg id="ic-err" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const orb = document.getElementById('orb');
const r1 = document.getElementById('r1');
const r2 = document.getElementById('r2');
const r3 = document.getElementById('r3');
const icRec = document.getElementById('ic-rec');
const icOk  = document.getElementById('ic-ok');
const icErr = document.getElementById('ic-err');

function setRingsVisible(on) {
  [r1, r2, r3].forEach(r => r.classList.toggle('hidden', !on));
}
function setIcon(which) {
  icRec.style.display = which === 'rec' ? 'block' : 'none';
  icOk.style.display  = which === 'ok'  ? 'block' : 'none';
  icErr.style.display = which === 'err' ? 'block' : 'none';
}

window.voicySet = function(s) {
  if (s === 'recording') {
    orb.className = 'orb';
    setIcon('rec');
    setRingsVisible(true);
    stage.classList.add('on');
  } else if (s === 'success') {
    orb.className = 'orb success';
    setIcon('ok');
    setRingsVisible(false);
    stage.classList.add('on');
  } else if (s === 'error') {
    orb.className = 'orb error';
    setIcon('err');
    setRingsVisible(false);
    stage.classList.add('on');
  } else {
    stage.classList.remove('on');
  }
};
</script>
</body>
</html>

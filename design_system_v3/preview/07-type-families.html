<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Voicy — type families</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .fam { border: 1px solid var(--line); border-radius: var(--r-3); padding: 16px 18px; background: var(--paper); }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-bottom: 8px; }
  .big { font-size: 44px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; color: var(--ink); }
  .glyphs { margin-top: 8px; color: var(--ink-2); font-size: 14px; line-height: 22px; }
  .mono .big { font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.01em; }
  .mono .glyphs { font-family: var(--font-mono); }
  .note { margin-top: 10px; font-size: 11px; color: var(--ink-3); }
</style></head><body>
<div class="fam">
  <div class="label">Display + body</div>
  <div class="big">Onest</div>
  <div class="glyphs">Аа Бб Вв Гг · Aa Bb Cc · 0123456789</div>
  <div class="note">Cyrillic + Latin · weights 400 / 500 / 600 / 700</div>
</div>
<div class="fam mono">
  <div class="label">Mono</div>
  <div class="big">JetBrains Mono</div>
  <div class="glyphs">Аа Бб Вв · 0 → O · 1 / I / l · =&gt; ::</div>
  <div class="note" style="font-family:var(--font-sans);">Hotkeys, code, .toml only · weight 500</div>
</div>
</body></html>
